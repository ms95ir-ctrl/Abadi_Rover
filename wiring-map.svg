<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1640" viewBox="0 0 2400 1640">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f4f6f8; stroke: #2b2b2b; stroke-width: 3; }
    .later { fill: #fbfbfb; stroke: #888; stroke-width: 3; stroke-dasharray: 14 8; }
    .uno { fill: #e8f1fb; stroke: #0b5cad; stroke-width: 4; }
    .gnd { fill: #f0f0f0; stroke: #000; stroke-width: 4; }
    .tag { fill: #ffffff; stroke-width: 3; }
    .h { font: bold 26px sans-serif; fill: #111; }
    .h2 { font: bold 22px sans-serif; fill: #111; }
    .t { font: 19px sans-serif; fill: #222; }
    .s { font: 17px sans-serif; fill: #444; }
    .pinbox { fill: #ffffff; stroke: #0b5cad; stroke-width: 2; }
    .pin { font: bold 19px monospace; fill: #0b5cad; }
    .cpin { font: bold 18px monospace; fill: #222; }
    .wire { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .bus { fill: none; stroke-width: 12; stroke-linecap: round; }
    .red { stroke: #d62728; }
    .orange { stroke: #ff8c00; }
    .purple { stroke: #8e44ad; }
    .yellow { stroke: #e0b000; }
    .black { stroke: #111; }
    .usb { stroke: #7f8c8d; }
    .warn { font: bold 19px sans-serif; fill: #b00020; }
  </style>
  <rect class="bg" width="2400" height="1640"/>

  <text x="40" y="50" class="h" style="font-size:34px">ABADI ROVER  -  PHASE 1 WIRING MAP</text>
  <text x="760" y="50" class="s">Source of truth: plan.md (locked pin table). Dashed boxes = wire later (Phase 2).</text>

  <!-- ================= POWER SECTION ================= -->
  <!-- Power bank -->
  <rect class="box" x="40" y="90" width="270" height="270" rx="14"/>
  <text x="58" y="125" class="h2">POWER BANK</text>
  <text x="58" y="148" class="s">20000mAh, 45W</text>
  <rect class="tag" x="60" y="160" width="230" height="46" rx="8" style="stroke:#d62728"/>
  <text x="74" y="190" class="t">USB-A</text>
  <rect class="tag" x="60" y="220" width="230" height="46" rx="8" style="stroke:#7f8c8d"/>
  <text x="74" y="250" class="t">USB-C port 2 (PD)</text>
  <rect class="tag" x="60" y="280" width="230" height="60" rx="8" style="stroke:#aaa;stroke-dasharray:6 4"/>
  <text x="74" y="305" class="s">USB-C port 1</text>
  <text x="74" y="328" class="s">charging only (robot off)</text>

  <!-- USB-A to key switch -->
  <path class="wire red" d="M290 183 H400"/>
  <text x="312" y="170" class="s">screw</text>
  <text x="312" y="210" class="s">adapter</text>

  <!-- Key switch -->
  <rect class="box" x="400" y="140" width="180" height="86" rx="12"/>
  <text x="418" y="172" class="h2">KEY SWITCH</text>
  <text x="418" y="198" class="s">kills motors,</text>
  <text x="418" y="218" class="s">servos and fan</text>

  <!-- Noisy 5V bus -->
  <path class="bus red" d="M580 183 H1500"/>
  <text x="600" y="168" class="h2" style="fill:#d62728">NOISY 5V (red)</text>

  <path class="wire red" d="M690 183 V250"/>
  <rect class="box" x="615" y="250" width="150" height="80" rx="12"/>
  <text x="632" y="282" class="h2">FAN 5V</text>
  <text x="632" y="308" class="s">keep-awake load</text>

  <rect class="later" x="795" y="250" width="170" height="80" rx="12"/>
  <text x="810" y="278" class="h2">BULK CAP</text>
  <text x="810" y="300" class="s">1000uF already on</text>
  <text x="810" y="320" class="s">PCA9685 board</text>

  <path class="wire red" d="M1080 183 V250"/>
  <rect class="box" x="990" y="250" width="200" height="80" rx="12"/>
  <text x="1005" y="278" class="h2">HW-183B boost</text>
  <text x="1005" y="300" class="s">screw input</text>
  <text x="1005" y="320" class="s">set 7.0V under load</text>
  <path class="wire orange" d="M1190 290 H1500"/>
  <text x="1210" y="280" class="h2" style="fill:#ff8c00">MOTOR 7V (orange)</text>

  <rect class="tag" x="1500" y="160" width="290" height="46" rx="8" style="stroke:#d62728"/>
  <text x="1514" y="190" class="t">to PCA9685 V+ terminal</text>
  <rect class="tag" x="1500" y="267" width="290" height="46" rx="8" style="stroke:#ff8c00"/>
  <text x="1514" y="297" class="t">to DRV8833 VCC</text>

  <!-- USB-C 2 to hub -->
  <path class="wire usb" d="M290 243 H345 V470 H400" style="stroke-width:9"/>

  <!-- Hub -->
  <rect class="box" x="400" y="410" width="270" height="140" rx="14"/>
  <text x="418" y="444" class="h2">USB-C HUB (Benfei)</text>
  <text x="418" y="470" class="s">PD-IN from bank USB-C 2</text>
  <text x="418" y="494" class="s">USB: camera, audio (Phase 3)</text>
  <text x="418" y="518" class="s">USB: screw adapter = quiet 5V</text>
  <text x="418" y="540" class="s">USB-C cable to UNO Q</text>

  <!-- Quiet 5V bus -->
  <path class="bus purple" d="M670 470 H1500"/>
  <text x="700" y="455" class="h2" style="fill:#8e44ad">QUIET 5V (purple)</text>
  <rect class="tag" x="1500" y="447" width="290" height="46" rx="8" style="stroke:#8e44ad"/>
  <text x="1514" y="477" class="t">to HC-SR04 VCC</text>

  <path class="wire purple" d="M1000 470 V520"/>
  <rect class="box" x="910" y="520" width="180" height="70" rx="12"/>
  <text x="925" y="550" class="h2">HW-133A buck</text>
  <text x="925" y="574" class="s">set 3.3V first</text>
  <path class="wire yellow" d="M1090 555 H1500"/>
  <text x="1110" y="545" class="h2" style="fill:#c79a00">RAIL C 3.3V (yellow)</text>
  <rect class="tag" x="1500" y="520" width="290" height="70" rx="8" style="stroke:#e0b000"/>
  <text x="1514" y="548" class="t">to screens VCC, relay VCC,</text>
  <text x="1514" y="574" class="t">relay COM1 + COM2</text>

  <!-- Star ground -->
  <rect class="gnd" x="1830" y="90" width="530" height="520" rx="14"/>
  <text x="1850" y="128" class="h2">STAR GROUND (black)</text>
  <text x="1850" y="152" class="s">one screw bus bar / lever connector</text>
  <text x="1850" y="190" class="t">- USB-A adapter minus</text>
  <text x="1850" y="218" class="t">- Quiet 5V adapter minus</text>
  <text x="1850" y="246" class="t">- HW-183B IN- and OUT-</text>
  <text x="1850" y="274" class="t">- HW-133A IN- and OUT-</text>
  <text x="1850" y="302" class="t">- (bulk cap is on PCA9685 board)</text>
  <text x="1850" y="330" class="t">- Fan minus</text>
  <text x="1850" y="358" class="t">- DRV8833 GND</text>
  <text x="1850" y="386" class="t">- PCA9685 GND terminal</text>
  <text x="1850" y="414" class="t">- HC-SR04 GND</text>
  <text x="1850" y="442" class="t">- Relay board GND</text>
  <text x="1850" y="470" class="t">- Lights minus</text>
  <text x="1850" y="498" class="t">- Screens GND (Phase 2)</text>
  <text x="1850" y="526" class="t">- UNO Q GND screw (one wire)</text>
  <text x="1850" y="580" class="warn">Every "GND" on this map goes here.</text>

  <!-- Hub to UNO Q -->
  <path class="wire usb" d="M535 550 V645 H1160 V700" style="stroke-width:9"/>
  <text x="600" y="635" class="t">USB-C cable: the ONLY power for the UNO Q</text>

  <!-- ================= SIGNAL SECTION ================= -->
  <!-- UNO Q -->
  <rect class="uno" x="900" y="700" width="520" height="700" rx="18"/>
  <text x="1010" y="745" class="h" style="fill:#0b5cad">ARDUINO UNO Q</text>
  <text x="1040" y="772" class="s">screw-terminal shield</text>

  <!-- UNO Q left pins -->
  <rect class="pinbox" x="902" y="795" width="110" height="36" rx="6"/><text x="915" y="820" class="pin">D3</text>
  <rect class="pinbox" x="902" y="845" width="110" height="36" rx="6"/><text x="915" y="870" class="pin">D5</text>
  <rect class="pinbox" x="902" y="895" width="110" height="36" rx="6"/><text x="915" y="920" class="pin">D6</text>
  <rect class="pinbox" x="902" y="945" width="110" height="36" rx="6"/><text x="915" y="970" class="pin">D9</text>
  <rect class="pinbox" x="902" y="1075" width="110" height="36" rx="6"/><text x="915" y="1100" class="pin">D20 SDA</text>
  <rect class="pinbox" x="902" y="1125" width="110" height="36" rx="6"/><text x="915" y="1150" class="pin">D21 SCL</text>
  <rect class="pinbox" x="902" y="1175" width="110" height="36" rx="6"/><text x="915" y="1200" class="pin">3.3V</text>
  <rect class="pinbox" x="902" y="1225" width="110" height="36" rx="6"/><text x="915" y="1250" class="pin">GND</text>

  <!-- UNO Q right pins -->
  <rect class="pinbox" x="1308" y="795" width="110" height="36" rx="6"/><text x="1322" y="820" class="pin">D4</text>
  <rect class="pinbox" x="1308" y="845" width="110" height="36" rx="6"/><text x="1322" y="870" class="pin">D2</text>
  <rect class="pinbox" x="1308" y="935" width="110" height="36" rx="6"/><text x="1322" y="960" class="pin">A2</text>
  <rect class="pinbox" x="1308" y="985" width="110" height="36" rx="6"/><text x="1322" y="1010" class="pin">A3</text>
  <rect class="pinbox" x="1308" y="1095" width="110" height="36" rx="6"/><text x="1322" y="1120" class="pin">D10</text>
  <rect class="pinbox" x="1308" y="1145" width="110" height="36" rx="6"/><text x="1322" y="1170" class="pin">D7</text>
  <rect class="pinbox" x="1308" y="1195" width="110" height="36" rx="6"/><text x="1322" y="1220" class="pin">D8</text>
  <rect class="pinbox" x="1308" y="1245" width="110" height="36" rx="6"/><text x="1322" y="1270" class="pin">A0</text>
  <rect class="pinbox" x="1308" y="1295" width="110" height="36" rx="6"/><text x="1322" y="1320" class="pin">D11</text>
  <rect class="pinbox" x="1308" y="1345" width="110" height="36" rx="6"/><text x="1322" y="1370" class="pin">D13</text>

  <!-- UNO Q centre notes -->
  <text x="1040" y="1040" class="t">Reserved:</text>
  <text x="1040" y="1066" class="t">D0, D1, D12</text>
  <text x="1040" y="1110" class="t">Spare:</text>
  <text x="1040" y="1136" class="t">A1, A4, A5</text>
  <text x="1030" y="1300" class="warn" style="font-size:17px">Never feed power into</text>
  <text x="1030" y="1322" class="warn" style="font-size:17px">5V, 3.3V or IOREF pins</text>

  <!-- DRV8833 -->
  <rect class="box" x="380" y="760" width="330" height="270" rx="14"/>
  <text x="400" y="795" class="h2">DRV8833</text>
  <text x="400" y="822" class="cpin">IN1</text>
  <text x="400" y="872" class="cpin">IN2</text>
  <text x="400" y="922" class="cpin">IN3</text>
  <text x="400" y="972" class="cpin">IN4</text>
  <text x="470" y="822" class="s">VCC: MOTOR 7V</text>
  <text x="470" y="872" class="s">GND: STAR</text>
  <text x="470" y="922" class="s">EEP: J2 soldered</text>
  <text x="470" y="972" class="s">ULT: not connected</text>
  <text x="400" y="1015" class="s">OUT1/2 left, OUT3/4 right</text>
  <path class="wire" d="M710 813 H902" style="stroke:#1f77b4"/>
  <path class="wire" d="M710 863 H902" style="stroke:#2ca02c"/>
  <path class="wire" d="M710 913 H902" style="stroke:#17becf"/>
  <path class="wire" d="M710 963 H902" style="stroke:#8c564b"/>
  <text x="725" y="805" class="s">IN1 - D3</text>
  <text x="725" y="855" class="s">IN2 - D5</text>
  <text x="725" y="905" class="s">IN3 - D6</text>
  <text x="725" y="955" class="s">IN4 - D9</text>

  <!-- Motors -->
  <circle cx="190" cy="830" r="62" class="box"/>
  <text x="145" y="825" class="h2">LEFT</text>
  <text x="140" y="850" class="s">track motor</text>
  <circle cx="190" cy="975" r="62" class="box"/>
  <text x="140" y="970" class="h2">RIGHT</text>
  <text x="140" y="995" class="s">track motor</text>
  <path class="wire" d="M380 815 H252" style="stroke:#555"/>
  <path class="wire" d="M380 845 H252" style="stroke:#555"/>
  <text x="270" y="808" class="s">OUT1</text>
  <text x="270" y="870" class="s">OUT2</text>
  <path class="wire" d="M380 960 H252" style="stroke:#555"/>
  <path class="wire" d="M380 990 H252" style="stroke:#555"/>
  <text x="270" y="953" class="s">OUT3</text>
  <text x="270" y="1015" class="s">OUT4</text>

  <!-- PCA9685 -->
  <rect class="box" x="380" y="1060" width="330" height="320" rx="14"/>
  <text x="400" y="1094" class="h2">PCA9685 (0x40)</text>
  <text x="590" y="1100" class="cpin">SDA</text>
  <text x="590" y="1150" class="cpin">SCL</text>
  <text x="590" y="1200" class="cpin">VCC</text>
  <text x="590" y="1250" class="cpin">GND</text>
  <text x="400" y="1290" class="s">V+ terminal: NOISY 5V (1000uF on board)</text>
  <text x="400" y="1314" class="s">GND terminal: STAR</text>
  <text x="400" y="1338" class="s">OE: not connected</text>
  <text x="400" y="1362" class="s">50Hz servo signal</text>
  <path class="wire" d="M710 1093 H902" style="stroke:#e377c2"/>
  <path class="wire" d="M710 1143 H902" style="stroke:#2f4f4f"/>
  <path class="wire yellow" d="M710 1193 H902"/>
  <path class="wire black" d="M710 1243 H902"/>
  <text x="725" y="1085" class="s">SDA - D20</text>
  <text x="725" y="1135" class="s">SCL - D21</text>
  <text x="725" y="1185" class="s">VCC - 3.3V pin</text>
  <text x="725" y="1235" class="s">GND - GND</text>

  <!-- Servos -->
  <rect class="box" x="40" y="1080" width="250" height="70" rx="12"/>
  <text x="56" y="1110" class="h2">MG996R 180</text>
  <text x="56" y="1136" class="s">channel CH0</text>
  <rect class="box" x="40" y="1170" width="250" height="70" rx="12"/>
  <text x="56" y="1200" class="h2">MZ996 90?</text>
  <text x="56" y="1226" class="s">channel CH1</text>
  <rect class="box" x="40" y="1260" width="250" height="70" rx="12"/>
  <text x="56" y="1290" class="h2">360 continuous</text>
  <text x="56" y="1316" class="s">channel CH2 (orange gear)</text>
  <path class="wire" d="M290 1115 H380" style="stroke:#555"/>
  <path class="wire" d="M290 1205 H380" style="stroke:#555"/>
  <path class="wire" d="M290 1295 H380" style="stroke:#555"/>
  <text x="40" y="1360" class="s">Servo plug: brown = GND, red = V+,</text>
  <text x="40" y="1382" class="s">orange = signal. Match PCA9685 labels.</text>

  <!-- HC-SR04 -->
  <rect class="box" x="1620" y="770" width="330" height="140" rx="14"/>
  <text x="1640" y="802" class="h2">HC-SR04</text>
  <text x="1640" y="822" class="cpin">TRIG</text>
  <text x="1640" y="872" class="cpin">ECHO</text>
  <text x="1720" y="822" class="s">VCC: QUIET 5V</text>
  <text x="1720" y="872" class="s">GND: STAR</text>
  <path class="wire" d="M1418 813 H1620" style="stroke:#1f77b4"/>
  <path class="wire" d="M1418 863 H1620" style="stroke:#2ca02c"/>
  <text x="1435" y="805" class="s">D4 - TRIG</text>
  <text x="1435" y="855" class="s">D2 - ECHO</text>
  <text x="1625" y="900" class="warn" style="font-size:16px">ECHO only on D2 (5V signal)</text>

  <!-- Relay board -->
  <rect class="box" x="1620" y="925" width="330" height="140" rx="14"/>
  <text x="1640" y="957" class="h2">RELAY BOARD 3.3V</text>
  <text x="1640" y="982" class="cpin">IN1</text>
  <text x="1640" y="1012" class="cpin">IN2</text>
  <text x="1700" y="982" class="s">VCC: RAIL C 3.3V</text>
  <text x="1700" y="1012" class="s">GND: STAR</text>
  <text x="1640" y="1045" class="s">COM1 + COM2: RAIL C 3.3V</text>
  <path class="wire" d="M1418 953 H1520 V976 H1620" style="stroke:#17becf"/>
  <path class="wire" d="M1418 1003 H1520 V1006 H1620" style="stroke:#8c564b"/>
  <text x="1435" y="945" class="s">A2 - IN1</text>
  <text x="1435" y="1035" class="s">A3 - IN2</text>

  <!-- Lights -->
  <rect class="box" x="2000" y="925" width="360" height="140" rx="14"/>
  <text x="2018" y="957" class="h2">LIGHTS (LED filaments)</text>
  <text x="2018" y="985" class="s">NO1 - 10 ohm - light 1 (+)</text>
  <text x="2018" y="1011" class="s">NO2 - 10 ohm - light 2 (+)</text>
  <text x="2018" y="1037" class="s">light minus: STAR</text>
  <path class="wire yellow" d="M1950 995 H2000"/>

  <!-- Screens (later) -->
  <rect class="later" x="1620" y="1085" width="330" height="310" rx="14"/>
  <text x="1640" y="1117" class="h2" style="fill:#666">SCREENS (Phase 2)</text>
  <text x="1640" y="1140" class="s">wire later</text>
  <path class="wire" d="M1418 1113 H1620" style="stroke:#bbb;stroke-dasharray:10 6"/>
  <path class="wire" d="M1418 1163 H1620" style="stroke:#bbb;stroke-dasharray:10 6"/>
  <path class="wire" d="M1418 1213 H1620" style="stroke:#bbb;stroke-dasharray:10 6"/>
  <path class="wire" d="M1418 1263 H1620" style="stroke:#bbb;stroke-dasharray:10 6"/>
  <path class="wire" d="M1418 1313 H1620" style="stroke:#bbb;stroke-dasharray:10 6"/>
  <path class="wire" d="M1418 1363 H1620" style="stroke:#bbb;stroke-dasharray:10 6"/>
  <text x="1435" y="1105" class="s">D10 - CS left</text>
  <text x="1435" y="1155" class="s">D7 - CS right</text>
  <text x="1435" y="1205" class="s">D8 - DC both</text>
  <text x="1435" y="1255" class="s">A0 - RST both</text>
  <text x="1435" y="1305" class="s">D11 - SDA both</text>
  <text x="1435" y="1355" class="s">D13 - SCL both</text>
  <text x="1640" y="1190" class="s">VCC: RAIL C 3.3V</text>
  <text x="1640" y="1216" class="s">GND: STAR</text>
  <text x="1640" y="1250" class="s">CS goes to ONE screen each.</text>
  <text x="1640" y="1276" class="s">DC, RST, SDA, SCL go to</text>
  <text x="1640" y="1302" class="s">BOTH screens.</text>

  <rect class="later" x="2000" y="1120" width="160" height="110" rx="12"/>
  <text x="2030" y="1170" class="h2" style="fill:#666">LEFT</text>
  <text x="2030" y="1196" class="s">eye, CS D10</text>
  <rect class="later" x="2190" y="1120" width="160" height="110" rx="12"/>
  <text x="2215" y="1170" class="h2" style="fill:#666">RIGHT</text>
  <text x="2215" y="1196" class="s">eye, CS D7</text>
  <path class="wire" d="M1950 1175 H2000" style="stroke:#bbb;stroke-dasharray:10 6"/>

  <!-- UNO GND to star -->
  <path class="wire black" d="M1160 1400 V1440"/>
  <text x="1180" y="1435" class="t">UNO Q GND screw to STAR (one wire)</text>

  <!-- Legend -->
  <rect class="box" x="40" y="1470" width="2320" height="140" rx="14"/>
  <text x="60" y="1505" class="h2">WIRE COLOURS</text>
  <path class="bus red" d="M60 1540 H140"/><text x="155" y="1547" class="t">Noisy 5V</text>
  <path class="bus orange" d="M290 1540 H370"/><text x="385" y="1547" class="t">Motor 7V</text>
  <path class="bus purple" d="M520 1540 H600"/><text x="615" y="1547" class="t">Quiet 5V</text>
  <path class="bus yellow" d="M750 1540 H830"/><text x="845" y="1547" class="t">3.3V</text>
  <path class="bus black" d="M950 1540 H1030"/><text x="1045" y="1547" class="t">GND</text>
  <path class="wire" d="M1140 1540 H1220" style="stroke:#1f77b4"/><text x="1235" y="1547" class="t">Signals (any other colour)</text>
  <text x="60" y="1590" class="s">Power wires 20-22 AWG, signal wires 24-26 AWG. Lift the tracks for every first motor test. Set every converter's voltage before connecting its load. Glue the HW-183B dial after setting 7.0V.</text>
</svg>
